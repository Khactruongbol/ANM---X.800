# Phase 8 - Nginx lab configuration.
# Thay APP_ROOT, server_name và đường dẫn chứng thư theo máy thực tế.

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;
    root C:/xampp/htdocs/website-tin-tuc;
    index frontend/public/index.html;

    ssl_certificate C:/xampp/htdocs/website-tin-tuc/certs/server.crt;
    ssl_certificate_key C:/xampp/htdocs/website-tin-tuc/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;

    location / {
        try_files $uri $uri/ =404;
    }

    location /backend/ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.ckeditor.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'" always;

    # Chỉ bật HSTS sau khi HTTPS đã ổn định trên host thật.
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
