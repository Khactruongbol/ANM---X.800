# Phase 8 - Apache/XAMPP lab configuration.
# Copy the required directives into httpd-vhosts.conf or adapt the paths.
# Do not commit certs/server.key or certs/server.crt.

Define APP_ROOT "C:/xampp/htdocs/website-tin-tuc"

<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot "${APP_ROOT}"

    SSLEngine on
    SSLCertificateFile "${APP_ROOT}/certs/server.crt"
    SSLCertificateKeyFile "${APP_ROOT}/certs/server.key"

    <Directory "${APP_ROOT}">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.ckeditor.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'"

    # Chỉ bật HSTS sau khi HTTPS đã ổn định trên host thật.
    # Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
